services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${JARVIS_PG_PASSWORD:-jarvis_local_dev}
      POSTGRES_DB: jarvis
    volumes:
      - jarvis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jarvis_pgdata:

