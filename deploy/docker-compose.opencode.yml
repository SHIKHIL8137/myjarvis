# Reference single-task Compose definition for Jarvis OpenCode Sandbox
# Do NOT bind host ~/.ssh, ~/.config, .env, or /var/run/docker.sock.
services:
  opencode-sandbox:
    build:
      context: ..
      dockerfile: deploy/opencode.Dockerfile
    image: jarvis-opencode:1.19.5
    user: "10001:10001"
    read_only: true
    network_mode: "none"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1024m
    cpus: 2.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /home/jarvis/.local/state:rw,nosuid,size=32m
    working_dir: /workspace

